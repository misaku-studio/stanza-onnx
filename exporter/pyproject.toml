[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stanza-onnx-export"
version = "0.3.0"
description = "Export and package pinned Stanza models for portable ONNX inference"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-UNICODE"]
dependencies = [
  "numpy==2.5.4",
  "stanza==1.11.0",
  "torch==2.10.0",
  "onnx==1.20.1",
  "onnxruntime==1.23.2",
]

[project.optional-dependencies]
dev = ["black==24.10.0"]

[project.scripts]
stanza-onnx = "stanza_onnx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stanza_onnx = ["data/*.json"]
