[package]
name = "stanza-onnx"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Portable native inference for exported Stanza pipelines"
readme = "../../README.md"
repository = "https://github.com/misaku-studio/stanza-onnx"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
regex = "1.11"
fancy-regex = "0.14"
libloading = "0.8"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic", "coreml", "directml"] }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.20"
